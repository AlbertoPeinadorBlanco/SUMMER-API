name: Deploy to Hetzner VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── SSH into the VPS and redeploy ─────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # Use flock to prevent race conditions if both API and Frontend workflows run simultaneously
            exec 200>/tmp/surfmarket_deploy.lock
            flock -n 200 || { echo "Another deployment is running. Waiting..."; flock 200; }

            cd ~/SURFING/CODE

            # Pull latest code
            cd ~/SURFING/CODE/SUMMER
            git pull origin main
            
            cd ~/SURFING/CODE/SUMMER-API
            git pull origin main

            cd ~/SURFING/CODE

            # Rebuild and restart only changed containers (zero-downtime rolling update)
            docker compose pull
            docker compose up -d --build --remove-orphans

            # Restart Nginx to flush old Docker IP addresses and prevent 502 Bad Gateway
            docker compose restart nginx

            # Remove unused images to keep disk clean
            docker image prune -f

            echo "✅ Deployment complete"
